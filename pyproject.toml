[project]
name = "project-2-team-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "open-clip-torch>=3.3.0",
    "peft>=0.17.1",
    "pycocoevalcap>=1.2",
    "timm>=1.0.9",
    "torch>=2.5.0",
    "torchmetrics[text]>=1.8.2",
    "torchvision>=0.20.0",
    "transformers>=4.57.6",
]

# for server, force uv to download pytorch compiled for older server gpus
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
