[project]
name = "project-2-team-1"
version = "0.1.0"
description = "Bi-temporal VLM for change captionning on remote sensing images"
readme = "README.md"
requires-python = ">=3.9, <3.13"
dependencies = [
    "accelerate>=1.10.1",
    "clip",
    "datasets>=4.5.0",
    "evaluate>=0.4.6",
    "open-clip-torch>=3.3.0",
    "peft>=0.17.1",
    "pillow>=11.3.0",
    "protobuf>=6.33.6",
    "pycocoevalcap>=1.2",
    "scikit-learn>=1.6.1",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.13.0",
    "timm>=1.0.9",
    "torch>=2.5.0",
    "torchmetrics[text]>=1.8.2",
    "torchvision>=0.20.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.6",
    "ultralytics>=8.4.60",
]

# for server, force uv to download pytorch compiled for older server gpus
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu118", marker = "sys_platform == 'linux'" }
clip = { git = "https://github.com/openai/CLIP.git" }

[dependency-groups]
dev = [
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
]
